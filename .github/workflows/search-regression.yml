name: Search regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/run-search-regression.mjs'
      - 'tests/search-regression-cases.json'
      - 'tests/search-regression.test.mjs'
      - 'scripts/run-study-chat03-validation.mjs'
      - 'tests/study-chat03*'
      - 'learning-note-utils.js'
      - '.github/workflows/search-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: node scripts/run-search-regression.mjs
      - run: node scripts/run-study-chat03-validation.mjs
