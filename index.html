<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7bbd7b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="김토끼">
  <title>김토끼</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
    }

    .card {
      width: 360px;
      padding: 40px 30px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
      font-size: 38px;
    }

    .description {
      margin-bottom: 28px;
      color: #666;
      line-height: 1.6;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    #message,
    #fortune,
    #currentTime {
      min-height: 32px;
      margin-top: 22px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>안녕~김토끼 🐰</h1>

    <p class="description">
      ChatGPT와 GitHub로 기능을 추가하며<br>
      배우는 공개 웹페이지입니다.
    </p>

    <button onclick="sayHello()">
      김토끼에게 인사하기
    </button>

    <button onclick="showFortune()">
      오늘의 행운 보기
    </button>

    <button onclick="showCurrentTime()">
      현재 시간 보기
    </button>

    <div id="message"></div>
    <div id="fortune"></div>
    <div id="currentTime"></div>
  </div>

  <script>
    function sayHello() {
      document.getElementById("message").innerText = "반가워요! 🐰";
    }

    function showFortune() {
      document.getElementById("fortune").innerText = "오늘은 작은 행운이 찾아옵니다 🍀";
    }

    function showCurrentTime() {
      const now = new Date();
      const formatted = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(now);

      document.getElementById("currentTime").innerText = `지금은 ${formatted} ⏰`;
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.error("Service Worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
