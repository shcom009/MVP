<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김토끼 TEST</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
    }

    .card {
      width: 360px;
      padding: 40px 30px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
      font-size: 38px;
    }

    .description {
      margin-bottom: 28px;
      color: #666;
      line-height: 1.6;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    #message,
    #fortune {
      min-height: 32px;
      margin-top: 22px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>안녕~김토끼 TEST 🐰</h1>

    <p class="description">
      test-design 브랜치에서만 보이는<br>
      실험용 페이지입니다.
    </p>

    <button onclick="sayHello()">
      김토끼에게 인사하기
    </button>

    <button onclick="showFortune()">
      오늘의 행운 보기
    </button>

    <div id="message"></div>
    <div id="fortune"></div>
  </div>

  <script>
    function sayHello() {
      document.getElementById("message").innerText = "반가워요! 🐰";
    }

    function showFortune() {
      document.getElementById("fortune").innerText = "오늘은 작은 행운이 찾아옵니다 🍀";
    }
  </script>
</body>
</html>
