<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="김토끼니혼고">
  <title>김토끼니혼고</title>
  <link rel="icon" type="image/svg+xml" href="app-icon.svg">
  <link rel="apple-touch-icon" href="app-icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f5;color:#1f2328;font-family:Arial,"Noto Sans KR",sans-serif}
    .loading{text-align:center;padding:28px}.loading strong{display:block;font-size:22px;margin-bottom:10px}.loading span{color:#737b84;font-size:13px}
  </style>
</head>
<body>
  <div class="loading"><strong>김토끼니혼고</strong><span>검색 화면을 여는 중…</span></div>
  <script>
    const go=()=>location.replace('./nihongo.html');
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js').then(()=>go()).catch(()=>go());
      setTimeout(go,1800);
    }else{go();}
  </script>
</body>
</html>
