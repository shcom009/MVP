<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f5" />
  <title>김토끼니혼고</title>
  <style>
    :root{
      --bg:#f7f7f5;--card:#fff;--text:#1f2328;--muted:#737b84;--line:#e7e8e5;
      --accent:#22272e;--soft:#f0f1ee;--soft2:#fafaf8;--error:#b42318;--shadow:0 18px 60px rgba(31,35,40,.16)
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
    button,input{font:inherit}.app{width:min(100%,760px);margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px 48px}
    .brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 18px}.brand strong{font-size:22px;letter-spacing:-.7px}.brand span{font-size:12px;color:var(--muted);white-space:nowrap}
    .search-row{display:grid;grid-template-columns:1fr 46px 70px;gap:8px}.search-row input,.search-row button{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
    .search-row input{width:100%;padding:0 15px;font-size:16px;outline:none}.search-row input:focus{border-color:#aeb4ba;box-shadow:0 0 0 3px rgba(31,35,40,.06)}.search-row button{cursor:pointer;font-weight:700}
    #micBtn{font-size:18px;color:var(--text)}#searchBtn{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}
    .hint{min-height:24px;padding:10px 3px 0;font-size:13px;color:var(--muted)}.status{padding:14px 3px;color:var(--muted);font-size:14px}.status.error{color:var(--error)}
    .category-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 1px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}.category-strip::-webkit-scrollbar{display:none}.category-strip[hidden]{display:none}
    .category-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;color:var(--text);cursor:pointer;font-size:13px}.category-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .results{margin-top:2px;border-top:1px solid var(--line)}.result{display:grid;grid-template-columns:1fr auto;gap:9px 14px;padding:17px 3px 16px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:rgba(255,255,255,.45)}
    .meaning{font-size:17px;font-weight:700;line-height:1.4;letter-spacing:-.2px}.pron{grid-column:1/-1;font-size:16px;line-height:1.5;word-break:keep-all}.match{align-self:start;padding:4px 7px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:10px}.arrow{display:none}
    .empty{padding:28px 3px;color:var(--muted);text-align:center;line-height:1.7}.loading-line{height:2px;background:linear-gradient(90deg,transparent,#8a9199,transparent);background-size:200% 100%;animation:load 1.1s linear infinite}@keyframes load{to{background-position:-200% 0}}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(20,24,28,.28);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}.sheet-backdrop[hidden]{display:none}.sheet{width:min(100%,760px);max-height:min(82vh,720px);overflow:auto;background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding:10px 18px max(24px,env(safe-area-inset-bottom))}.grab{width:38px;height:4px;border-radius:99px;background:#d8dbde;margin:0 auto 10px}.sheet-top{display:flex;align-items:center;justify-content:flex-end}.close-btn{border:0;background:transparent;font-size:22px;line-height:1;padding:8px;cursor:pointer;color:var(--muted)}
    .detail-main{padding:4px 2px 15px}.detail-meaning{font-size:24px;font-weight:800;line-height:1.35;letter-spacing:-.6px}.detail-pron{margin-top:9px;font-size:20px;line-height:1.5;word-break:keep-all}.alt-meanings{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.55}
    .detail-divider{border:0;border-top:1px solid var(--line);margin:0}.action-row{display:flex;flex-wrap:wrap;gap:8px;padding:14px 1px}.action-row[hidden]{display:none}.action-btn{border:1px solid var(--line);background:var(--soft2);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:13px}.action-btn strong{font-weight:800}.category-tags{display:flex;flex-wrap:wrap;gap:7px;padding:0 1px 14px}.category-tags[hidden]{display:none}.tag{background:var(--soft);color:var(--muted);border-radius:999px;padding:5px 9px;font-size:12px}
    .relation-panel{border-top:1px solid var(--line);padding-top:4px}.relation-panel[hidden]{display:none}.relation-item{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}.relation-item .r-meaning{font-weight:700}.relation-item .r-pron{grid-column:1/-1;color:#343a40}.relation-item .r-go{color:var(--muted);font-size:12px}
    .detail-note{padding:14px 2px;color:var(--muted);font-size:12px;line-height:1.55}
    @media(min-width:761px){.sheet-backdrop{align-items:center;padding:24px}.sheet{border-radius:24px;max-height:min(78vh,720px)}.grab{display:none}.sheet-top{padding-top:2px}}
    @media(max-width:430px){.app{padding-left:14px;padding-right:14px}.brand strong{font-size:21px}.brand span{display:none}.search-row{grid-template-columns:1fr 44px 64px}.result{padding-top:16px;padding-bottom:15px}.detail-meaning{font-size:22px}.detail-pron{font-size:19px}}
  </style>
</head>
<body>
  <main class="app">
    <div class="brand"><strong>김토끼니혼고</strong><span>들어올 수는 있어도 나갈 수는 없다</span></div>

    <form id="searchForm" class="search-row" autocomplete="off">
      <input id="searchInput" type="search" inputmode="search" placeholder="뜻 또는 일본어 발음을 한글로 검색" aria-label="일본어 표현 검색" />
      <button id="micBtn" type="button" title="음성 입력" aria-label="음성 입력">🎙</button>
      <button id="searchBtn" type="submit">검색</button>
    </form>

    <div id="hint" class="hint">예: 날씨 · 텐키 · 헷또쎗또</div>
    <nav id="categoryStrip" class="category-strip" aria-label="카테고리" hidden></nav>
    <div id="status" class="status" hidden></div>
    <div id="loadingLine" class="loading-line" hidden></div>
    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="표현 상세">
      <div class="grab"></div>
      <div class="sheet-top"><button id="closeSheet" class="close-btn" type="button" aria-label="닫기">×</button></div>
      <div class="detail-main">
        <div id="detailMeaning" class="detail-meaning"></div>
        <div id="detailPron" class="detail-pron"></div>
        <div id="altMeanings" class="alt-meanings"></div>
      </div>
      <hr class="detail-divider" />
      <div id="actionRow" class="action-row" hidden></div>
      <div id="categoryTags" class="category-tags" hidden></div>
      <div id="relationPanel" class="relation-panel" hidden></div>
      <div id="detailNote" class="detail-note">원본·Candidate·개인 메모는 이 화면에서 조회하지 않습니다.</div>
    </section>
  </div>

  <script>
    const SUPABASE_URL="https://pwwrvwtgrtegmrjulxji.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY="sb_publishable_mWZUenksN6A1A-sgyC_dqQ_PaNzQZf6";
    const API_HEADERS={apikey:SUPABASE_PUBLISHABLE_KEY};

    const form=document.getElementById("searchForm"),input=document.getElementById("searchInput"),micBtn=document.getElementById("micBtn"),searchBtn=document.getElementById("searchBtn");
    const statusBox=document.getElementById("status"),resultsBox=document.getElementById("results"),loadingLine=document.getElementById("loadingLine"),categoryStrip=document.getElementById("categoryStrip");
    const sheetBackdrop=document.getElementById("sheetBackdrop"),closeSheet=document.getElementById("closeSheet"),detailMeaning=document.getElementById("detailMeaning"),detailPron=document.getElementById("detailPron"),altMeanings=document.getElementById("altMeanings"),actionRow=document.getElementById("actionRow"),categoryTags=document.getElementById("categoryTags"),relationPanel=document.getElementById("relationPanel");

    const matchLabel={MEANING_EXACT:"뜻 정확",PRON_EXACT:"발음 정확",MEANING_PARTIAL:"뜻 포함",PRON_PARTIAL:"발음 포함",FUZZY:"비슷한 검색"};
    const relationLabel={SIMILAR:"비슷",OPPOSITE:"반대",FORM:"활용",RELATED:"관련"};
    let currentRows=[],activeCategoryId=null;

    function setStatus(message,isError=false){statusBox.hidden=!message;statusBox.textContent=message||"";statusBox.classList.toggle("error",isError)}
    function setLoading(on){loadingLine.hidden=!on;searchBtn.disabled=on;micBtn.disabled=on||!SpeechRecognitionCtor}
    function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    async function apiGet(path){const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers:API_HEADERS});if(!r.ok)throw new Error(`HTTP ${r.status}: ${await r.text()}`);return r.json()}
    async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{...API_HEADERS,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(`HTTP ${r.status}: ${await r.text()}`);return r.json()}

    function renderResults(rows){currentRows=rows;if(!rows.length){resultsBox.innerHTML='<div class="empty">찾은 표현이 없습니다.<br>발음이나 뜻을 조금 다르게 입력해 보세요.</div>';return}
      resultsBox.innerHTML=rows.map((row,i)=>`<article class="result" data-index="${i}" tabindex="0"><div class="meaning">${escapeHtml(row.meaning_text)}</div><div class="match">${escapeHtml(matchLabel[row.match_type]||row.match_type||"")}</div><div class="pron">${escapeHtml(row.display_pronunciation)}</div></article>`).join("");
    }

    async function searchExpressions(query){const q=query.trim();activeCategoryId=null;markCategory();if(!q){resultsBox.innerHTML="";setStatus("");input.focus();return}setLoading(true);setStatus("검색 중…");resultsBox.innerHTML="";
      try{const rows=await rpc("search_expressions",{p_query:q,p_limit:20});renderResults(rows);setStatus(`${rows.length}개 결과`)}catch(error){console.error(error);setStatus("검색 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.",true)}finally{setLoading(false)}}

    async function loadCategories(){try{const rows=await apiGet("category?select=id,name,category_type&status=eq.ACTIVE&parent_id=is.null&order=display_order.asc.nullslast,name.asc&limit=30");if(!rows.length)return;categoryStrip.innerHTML=rows.map(c=>`<button class="category-chip" type="button" data-id="${c.id}">${escapeHtml(c.name)}</button>`).join("");categoryStrip.hidden=false}catch(error){console.warn("category load skipped",error)}}
    function markCategory(){categoryStrip.querySelectorAll(".category-chip").forEach(b=>b.classList.toggle("active",String(activeCategoryId)===b.dataset.id))}

    async function searchCategory(categoryId){activeCategoryId=Number(categoryId);markCategory();input.value="";setLoading(true);setStatus("카테고리 불러오는 중…");resultsBox.innerHTML="";
      try{const links=await apiGet(`expression_category?select=expression_id&category_id=eq.${activeCategoryId}&limit=100`);const ids=[...new Set(links.map(x=>x.expression_id))];if(!ids.length){renderResults([]);setStatus("0개 결과");return}
        const idList=ids.join(",");const [exprs,meanings]=await Promise.all([apiGet(`expression?select=id,display_pronunciation&id=in.(${idList})&status=eq.ACTIVE`),apiGet(`expression_meaning?select=expression_id,meaning_text,is_primary&expression_id=in.(${idList})&is_primary=eq.true`)]);const m=new Map(meanings.map(x=>[x.expression_id,x.meaning_text]));const rows=exprs.map(e=>({expression_id:e.id,meaning_text:m.get(e.id)||"",display_pronunciation:e.display_pronunciation,match_type:""})).slice(0,50);renderResults(rows);setStatus(`${rows.length}개 결과`)}catch(error){console.error(error);setStatus("카테고리를 불러오지 못했습니다.",true)}finally{setLoading(false)}}

    async function openDetail(row){detailMeaning.textContent=row.meaning_text||"";detailPron.textContent=row.display_pronunciation||"";altMeanings.textContent="";actionRow.innerHTML="";actionRow.hidden=true;categoryTags.innerHTML="";categoryTags.hidden=true;relationPanel.innerHTML="";relationPanel.hidden=true;sheetBackdrop.hidden=false;document.body.style.overflow="hidden";
      try{const id=row.expression_id;const [meanings,rels,cats]=await Promise.all([apiGet(`expression_meaning?select=meaning_text,meaning_order,is_primary&expression_id=eq.${id}&order=meaning_order.asc`),apiGet(`expression_relation?select=from_expression_id,to_expression_id,relation_type,relation_subtype&or=(from_expression_id.eq.${id},to_expression_id.eq.${id})`),apiGet(`expression_category?select=category_id&expression_id=eq.${id}`)]);
        const others=meanings.filter(x=>!x.is_primary).map(x=>x.meaning_text);altMeanings.textContent=others.length?others.join(" · "):"";
        if(cats.length){const ids=[...new Set(cats.map(x=>x.category_id))].join(",");const rows=await apiGet(`category?select=id,name&status=eq.ACTIVE&id=in.(${ids})`);if(rows.length){categoryTags.innerHTML=rows.map(x=>`<span class="tag">${escapeHtml(x.name)}</span>`).join("");categoryTags.hidden=false}}
        if(rels.length)await prepareRelations(id,rels)
      }catch(error){console.warn("detail extras skipped",error)}}

    async function prepareRelations(currentId,rels){const groups={};for(const r of rels){const type=r.relation_type||"RELATED";(groups[type]??=[]).push({...r,targetId:r.from_expression_id===currentId?r.to_expression_id:r.from_expression_id})}const allIds=[...new Set(rels.map(r=>r.from_expression_id===currentId?r.to_expression_id:r.from_expression_id))];if(!allIds.length)return;const idList=allIds.join(",");const [exprs,meanings]=await Promise.all([apiGet(`expression?select=id,display_pronunciation&id=in.(${idList})&status=eq.ACTIVE`),apiGet(`expression_meaning?select=expression_id,meaning_text,is_primary&expression_id=in.(${idList})&is_primary=eq.true`)]);const eMap=new Map(exprs.map(x=>[x.id,x.display_pronunciation])),mMap=new Map(meanings.map(x=>[x.expression_id,x.meaning_text]));const usable={};for(const [type,list] of Object.entries(groups)){usable[type]=list.map(x=>({expression_id:x.targetId,meaning_text:mMap.get(x.targetId)||"",display_pronunciation:eMap.get(x.targetId)||""})).filter(x=>x.display_pronunciation)}const types=Object.keys(usable).filter(t=>usable[t].length);if(!types.length)return;
      actionRow.innerHTML=types.map(t=>`<button class="action-btn" type="button" data-relation="${escapeHtml(t)}"><strong>${escapeHtml(relationLabel[t]||t)}</strong> ${usable[t].length}</button>`).join("");actionRow.hidden=false;actionRow.onclick=e=>{const b=e.target.closest("[data-relation]");if(!b)return;const type=b.dataset.relation;relationPanel.innerHTML=usable[type].map((x,i)=>`<div class="relation-item" data-relation-index="${i}" data-relation-type="${escapeHtml(type)}"><div class="r-meaning">${escapeHtml(x.meaning_text)}</div><div class="r-go">열기</div><div class="r-pron">${escapeHtml(x.display_pronunciation)}</div></div>`).join("");relationPanel.hidden=false;relationPanel.scrollIntoView({behavior:"smooth",block:"nearest"});relationPanel.onclick=ev=>{const item=ev.target.closest(".relation-item");if(!item)return;const target=usable[item.dataset.relationType][Number(item.dataset.relationIndex)];openDetail(target)}}
    }

    function closeDetail(){sheetBackdrop.hidden=true;document.body.style.overflow="";relationPanel.hidden=true}
    form.addEventListener("submit",e=>{e.preventDefault();searchExpressions(input.value)});resultsBox.addEventListener("click",e=>{const el=e.target.closest(".result");if(el)openDetail(currentRows[Number(el.dataset.index)])});resultsBox.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.closest(".result")){e.preventDefault();openDetail(currentRows[Number(e.target.closest(".result").dataset.index)])}});categoryStrip.addEventListener("click",e=>{const b=e.target.closest(".category-chip");if(b)searchCategory(b.dataset.id)});closeSheet.addEventListener("click",closeDetail);sheetBackdrop.addEventListener("click",e=>{if(e.target===sheetBackdrop)closeDetail()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheetBackdrop.hidden)closeDetail()});

    const SpeechRecognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognitionCtor){micBtn.disabled=true;micBtn.title="이 브라우저에서는 음성 입력을 지원하지 않습니다"}else{const recognition=new SpeechRecognitionCtor();recognition.lang="ko-KR";recognition.interimResults=false;recognition.maxAlternatives=1;micBtn.addEventListener("click",()=>{try{recognition.start();setStatus("말씀해 주세요…")}catch(_){}});recognition.addEventListener("result",e=>{const text=e.results?.[0]?.[0]?.transcript||"";input.value=text;searchExpressions(text)});recognition.addEventListener("error",()=>setStatus("음성 입력을 사용할 수 없습니다. 텍스트로 검색해 주세요.",true))}

    loadCategories();input.focus();
  </script>
</body>
</html>
