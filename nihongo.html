<body>
  <main class="app">
    <div class="brand"><div class="brand-title"><button id="menuBtn" class="menu-open" type="button" aria-label="메뉴 열기" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button><img src="./app-icon.svg" alt="" /><strong>김토끼니혼고</strong></div><div class="brand-actions"><span>들어올 수는 있어도 나갈 수는 없다</span><button id="storyBtn" class="story-open" type="button">Story</button></div></div>

    <form id="searchForm" class="search-row" autocomplete="off">
      <input id="searchInput" type="search" inputmode="search" placeholder="뜻 또는 일본어 발음을 한글로 검색" aria-label="일본어 표현 검색" />
      <button id="micBtn" type="button" title="음성 입력" aria-label="음성 입력"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6"></path></svg></button>
      <button id="searchBtn" type="submit">검색</button>
    </form>

    <div id="hint" class="hint">예: 날씨 · 텐키 · 헷또쎗또</div>
    <nav id="categoryStrip" class="category-strip" aria-label="카테고리" hidden></nav>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <div id="loadingLine" class="loading-line" hidden></div>
    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden>

      for(const d of dialogs){const lines=allLines.filter(x=>x.dialogue_id===d.id);const anchorIndexes=lines.map((x,i)=>anchorSet.has(Number(x.id))?i:-1).filter(i=>i>=0);if(!anchorIndexes.length)continue;const start=Math.max(0,Math.min(...anchorIndexes)-3),end=Math.min(lines.length,Math.max(...anchorIndexes)+4);const windowLines=lines.slice(start,end);selected.push(...windowLines);groups.push({dialogue:d,lines:windowLines,total:lines.length,start,end})}
      if(!groups.length)return;const selectedIds=[...new Set(selected.map(x=>x.id))];const lineLinks=selectedIds.length?await apiGet(`dialogue_expression?select=dialogue_line_id,expression_id&dialogue_line_id=in.(${selectedIds.join(",")})`):[];if(currentExpressionId!==currentId||sheetBackdrop.hidden)return;const exprByLine=new Map(lineLinks.map(x=>[Number(x.dialogue_line_id),Number(x.expression_id)]));currentDialogues=groups.map(g=>({id:g.dialogue.id,title:g.dialogue.title||"대화",situation:g.dialogue.situation||"대화",total:g.total,start:g.start,end:g.end,lines:g.lines.map(l=>({...l,expression_id:exprByLine.get(Number(l.id))||null,current:anchorSet.has(Number(l.id))}))}));
      actionRow.insertAdjacentHTML("beforeend",`<button class="action-btn" type="button" data-dialogue="1" aria-controls="dialoguePanel" aria-expanded="false"><strong>대화</strong><span class="action-count">${currentDialogues.length}</span></button>`);actionRow.hidden=false;
    }

    function dismissRelationPopover(restoreFocus=true){if(!relationPanel.hasAttribute("popover"))return;const trigger=actionRow.querySelector('.action-btn.active[data-relation]');if(relationPanel.matches(":popover-open"))relationPanel.hidePopover();relationPanel.removeAttribute("popover");relationPanel.removeAttribute("role");relationPanel.removeAttribute("aria-label");relationPanel.style.left="";relationPanel.style.top="";relationPanel.hidden=true;if(trigger){trigger.classList.remove("active");trigger.setAttribute("aria-expanded","false");if(restoreFocus)trigger.focus({preventScroll:true})}}
    relationPanel.addEventListener("toggle",()=>{if(relationPanel.hasAttribute("popover")&&!relationPanel.matches(":popover-open"))dismissRelationPopover()});
    document.addEventListener("keydown",e=>{if(!relationPanel.hasAttribute("popover")||!relationPanel.matches(":popover-open"))return;if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();dismissRelationPopover();return}if(e.key==="Tab"){const buttons=[...relationPanel.querySelectorAll("button")];if(!buttons.length)return;const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();e.stopImmediatePropagation();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();e.stopImmediatePropagation();first.focus()}}},true);
    function markActionActive(selector){actionRow.querySelectorAll(".action-btn").forEach(b=>{const active=b.matches(selector);b.classList.toggle("active",active);b.setAttribute("aria-expanded",String(active))})}

    function dismissQuickPopover(restoreFocus=true){if(quickPopover.matches(":popover-open"))quickPopover.hidePopover();quickPopover.innerHTML="";quickRows=[];markActionActive(":not(*)");if(restoreFocus&&quickTrigger?.isConnected)quickTrigger.focus({preventScroll:true});quickTrigger=null}
    function showQuickPopover(trigger,label,html,rows=[]){dismissQuickPopover(false);quickTrigger=trigger;quickRows=rows;quickPopover.innerHTML=`<div class="quick-popover-title">${escapeHtml(label)}</div>${html}`;quickPopover.setAttribute("aria-label",label);quickPopover.showPopover();const rect=trigger.getBoundingClientRect(),box=quickPopover.getBoundingClientRect();quickPopover.style.left=Math.max(16,Math.min(rect.left,window.innerWidth-box.width-16))+"px";quickPopover.style.top=Math.max(16,Math.min(rect.bottom+8,window.innerHeight-box.height-16))+"px"}
    function collapsePanels(){dismissQuickPopover(false);dismissRelationPopover(false);markActionActive(":not(*)");notePanel.hidden=true;relationPanel.hidden=true;dialoguePanel.hidden=true}
    function showNotes(type){const trigger=actionRow.querySelector(`[data-note="${CSS.escape(type)}"]`),rows=currentNoteGroups[type]||[];if(!trigger||!rows.length)return;showQuickPopover(trigger,noteLabel[type],rows.map(x=>`<div class="quick-note">${escapeHtml(x.note_text)}</div>`).join(""));markActionActive(`[data-note="${CSS.escape(type)}"]`)}

    function showRelation(type){const currentTrigger=actionRow.querySelector(`[data-relation="${CSS.escape(type)}"]`);if(currentTrigger?.classList.contains("active")){collapsePanels();return}dismissQuickPopover(false);dismissRelationPopover(false);markActionActive(`[data-relation="${CSS.escape(type)}"]`);const rows=currentRelationGroups[type]||[];notePanel.hidden=true;dialoguePanel.hidden=true;relationPanel.innerHTML=rows.map((x,i)=>`<button class="relation-item" type="button" data-relation-index="${i}" data-relation-type="${escapeHtml(type)}"><span class="r-meaning">${escapeHtml(x.meaning_text)}</span><span class="r-pron">${escapeHtml(x.display_pronunciation)}</span>${x.form_label?`<span class="r-meta">${escapeHtml(x.form_label)}</span>`:""}</button>`).join("");relationPanel.hidden=!rows.length;if(rows.length&&typeof relationPanel.showPopover==="function"){relationPanel.setAttribute("popover","auto");relationPanel.setAttribute("role","region");relationPanel.setAttribute("aria-label",relationLabel[type]||type);relationPanel.showPopover();const rect=currentTrigger.getBoundingClientRect(),box=relationPanel.getBoundingClientRect();relationPanel.style.left=Math.max(16,Math.min(rect.left,window.innerWidth-box.width-16))+"px";relationPanel.style.top=Math.max(16,Math.min(rect.bottom+8,window.innerHeight-box.height-16))+"px"}}

    function showListQuick(index,kind,type,trigger){const row=currentRows[index],extra=listExtras.get(Number(row?.expression_id));if(!row||!extra)return;if(kind==="dialogue"){openDetail(row,{panel:"DIALOGUE"});return}if(kind==="note"){const rows=extra.notes[type]||[];showQuickPopover(trigger,noteLabel[type]||type,rows.map(x=>`<div class="quick-note">${escapeHtml(x.note_text)}</div>`).join(""));return}const rows=(extra.relations[type]||[]).filter(x=>x.display_pronunciation);showQuickPopover(trigger,relationLabel[type]||type,rows.map((x,i)=>`<button class="relation-item" type="button" data-quick-relation-index="${i}"><span class="r-meaning">${escapeHtml(x.meaning_text)}</span><span class="r-pron">${escapeHtml(x.display_pronunciation)}</span>${x.form_label?`<span class="r-meta">${escapeHtml(x.form_label)}</span>`:""}</button>`).join(""),rows)}

    function showDialogues(){const trigger=actionRow.querySelector("[data-dialogue]");if(trigger?.classList.contains("active")){collapsePanels();return}dismissRelationPopover(false);markActionActive("[data-dialogue]");relationPanel.hidden=true;dialoguePanel.innerHTML=currentDialogues.map((d,di)=>`<div class="dialogue-card"><div class="dialogue-head"><div class="dialogue-title">${escapeHtml(d.title)}</div>${d.situation&&d.situation!=="대화"&&d.situation!==d.title?`<div class="dialogue-kind">${escapeHtml(d.situation)}</div>`:""}</div>${d.total>d.lines.length?`<div class="dialogue-window-note">전체 ${d.total}개 표현 중 현재 표현 주변만 표시</div>`:""}${d.lines.map((l,li)=>{const clickable=Boolean(l.expression_id&&!l.current),tag=clickable?"button":"div";return `<${tag} class="dialogue-line ${clickable?"clickable":""} ${l.current?"current":""}"${clickable?' type="button"':""} data-dialogue-index="${di}" data-line-index="${li}"><span class="d-meaning">${escapeHtml(l.korean_text||"")}</span><span class="d-mark">${l.current?"현재":""}</span><span class="d-pron">${escapeHtml(l.display_pronunciation||"")}</span></${tag}>`}).join("")}</div>`).join("");dialoguePanel.hidden=!currentDialogues.length;if(currentDialogues.length)dialoguePanel.scrollIntoView({behavior:"smooth",block:"nearest"})}

    function showPreviousDetail(){const previous=detailStack.pop();if(previous)openDetail(previous,{push:false})}
    function closeDetail(){dismissQuickPopover(false);dismissRelationPopover(false);sheetBackdrop.hidden=true;app.inert=false;document.body.style.overflow="";notePanel.hidden=true;relationPanel.hidden=true;dialoguePanel.hidden=true;detailHistoryActive=false;detailStack=[];currentDetailRow=null;detailBackBtn.hidden=true;const trigger=detailTrigger;detailTrigger=null;if(!restoreLearningAfterDetail()&&trigger?.isConnected)trigger.focus({preventScroll:true})}
    function requestCloseDetail(){if(detailHistoryActive&&history.state?.kimtokkiDetail)history.back();else closeDetail()}

    form.addEventListener("submit",e=>{e.preventDefault();searchExpressions(input.value)});input.addEventListener("search",()=>{if(!input.value)searchExpressions("")});
    resultsBox.addEventListener("click",e=>{if(e.target.closest(".show-more")){currentVisibleCount=currentRows.length;paintResults();return}const el=e.target.closest(".result");if(!el)return;const index=Number(el.dataset.index),reviewButton=e.target.closest(".review-toggle"),favoriteButton=e.target.closest(".favorite-toggle"),chip=e.target.closest(".summary-chip");if(reviewButton){toggleReview(currentRows[index]);return}if(favoriteButton){toggleFavorite(currentRows[index]);return}if(chip){showListQuick(index,chip.dataset.quickKind,chip.dataset.quickType,chip);return}if(e.target.closest(".result-main"))openDetail(currentRows[index])});
    categoryStrip.addEventListener("click",e=>{const b=e.target.closest(".category-chip");if(b)searchCategory(b.dataset.id,b.textContent.trim())});
    categoryTags.addEventListener("click",e=>{const tag=e.target.closest("[data-category-id]");if(!tag)return;requestCloseDetail();searchCategory(tag.dataset.categoryId,tag.textContent.trim())});
    actionRow.addEventListener("click",e=>{const nb=e.target.closest("[data-note]");if(nb){showNotes(nb.dataset.note);return}const rb=e.target.closest("[data-relation]");if(rb){showRelation(rb.dataset.relation);return}if(e.target.closest("[data-dialogue]")){notePanel.hidden=true;showDialogues()}});
    baseFormLink.addEventListener("click",()=>{if(currentBaseForm)openDetail(currentBaseForm)});detailBackBtn.addEventListener("click",showPreviousDetail);detailReviewBtn.addEventListener("click",()=>{if(currentDetailRow)toggleReview(currentDetailRow)});detailFavoriteBtn.addEventListener("click",()=>{if(currentDetailRow)toggleFavorite(currentDetailRow)});
    relationPanel.addEventListener("click",e=>{const item=e.target.closest(".relation-item");if(!item)return;const rows=currentRelationGroups[item.dataset.relationType]||[];const target=rows[Number(item.dataset.relationIndex)];if(target)openDetail(target)});
    dialoguePanel.addEventListener("click",e=>{const line=e.target.closest(".dialogue-line.clickable");if(!line)return;const d=currentDialogues[Number(line.dataset.dialogueIndex)],target=d?.lines?.[Number(line.dataset.lineIndex)];if(target?.expression_id)openDetail({expression_id:target.expression_id,meaning_text:target.korean_text,display_pronunciation:target.display_pronunciation})});
    quickPopover.addEventListener("toggle",()=>{if(!quickPopover.matches(":popover-open")){quickPopover.innerHTML="";quickRows=[];markActionActive(":not(*)")}});quickPopover.addEventListener("click",e=>{const item=e.target.closest("[data-quick-relation-index]");if(!item)return;const target=quickRows[Number(item.dataset.quickRelationIndex)];if(target){dismissQuickPopover(false);openDetail(target)}});
    menuBtn.addEventListener("click",openDrawer);drawerCloseBtn.addEventListener("click",()=>closeDrawer());drawerBackdrop.addEventListener("click",e=>{if(e.target===drawerBackdrop)closeDrawer()});drawer.addEventListener("click",e=>{const item=e.target.closest("[data-library]");if(item)openLearning(item.dataset.library)});drawerReviewStart.addEventListener("click",()=>openLearning("session"));
    exportBackupBtn.addEventListener("click",()=>{try{exportLearningBackup()}catch(error){console.error(error);setBackupStatus("파일을 내보내지 못했습니다. 다시 시도해 주세요.",true)}});
    importBackupBtn.addEventListener("click",()=>backupFileInput.click());backupFileInput.addEventListener("change",async()=>{const file=backupFileInput.files?.[0];if(!file)return;try{if(file.size>BACKUP_MAX_BYTES)throw new Error("백업 파일이 너무 큽니다 (최대 5MB).");const result=restoreLearningBackup(await file.text());setBackupStatus(`기존 목록과 합쳤습니다. 복습 ${result.reviewAdded}건·즐겨찾기 ${result.favoriteAdded}건 추가.`)}catch(error){setBackupStatus(error.message||"백업 파일을 가져오지 못했습니다.",true)}finally{backupFileInput.value=""}});
    learningCloseBtn.addEventListener("click",requestCloseLearning);learningBackdrop.addEventListener("click",e=>{if(e.target===learningBackdrop)requestCloseLearning()});learningBackBtn.addEventListener("click",requestLearningList);learningContent.addEventListener("click",e=>{const favoriteButton=e.target.closest("[data-favorite-index]");if(favoriteButton){const row=favoriteRows[Number(favoriteButton.dataset.favoriteIndex)];if(row)toggleFavorite(row);return}const item=e.target.closest("[data-learning-index]");if(item){const rows=learningMode==="review"?reviewRows:learningMode==="favorite"?favoriteRows:recentRows,row=rows[Number(item.dataset.learningIndex)];if(row)openLearningDetail(row);return}if(e.target.closest("[data-review-start]")){startReview();return}if(e.target.closest("[data-review-reveal]")){revealReview();return}const rate=e.target.closest("[data-review-rate]");if(rate){rateReview(rate.dataset.reviewRate);return}if(e.target.closest("[data-review-done]"))requestLearningList()});
    storyBtn.addEventListener("click",openStoryBrowser);storyBackBtn.addEventListener("click",requestStoryList);storyCloseBtn.addEventListener("click",requestCloseStory);storyBackdrop.addEventListener("click",e=>{if(e.target===storyBackdrop)requestCloseStory()});storyTabs.addEventListener("click",e=>{const tab=e.target.closest(".story-tab");if(tab){storyGroup=tab.dataset.storyGroup;paintStories();storySheet.scrollTop=0}});storyList.addEventListener("click",e=>{const item=e.target.closest(".story-item");if(item)showStory(Number(item.dataset.storyId))});
    closeSheet.addEventListener("click",requestCloseDetail);sheetBackdrop.addEventListener("click",e=>{if(e.target===sheetBackdrop)requestCloseDetail()});window.addEventListener("popstate",()=>{if(!sheetBackdrop.hidden)closeDetail();if(!storyBackdrop.hidden)handleStoryPopState();if(!learningBackdrop.hidden)handleLearningPopState()});
    function keepFocusInside(e,container){if(e.key!=="Tab")return;const focusable=[...container.querySelectorAll("button:not(:disabled)")].filter(x=>x.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    document.addEventListener("keydown",e=>{if(!drawerBackdrop.hidden){if(e.key==="Escape"){closeDrawer();return}keepFocusInside(e,drawer);return}if(!learningBackdrop.hidden){if(e.key==="Escape"){requestCloseLearning();return}keepFocusInside(e,learningSheet);return}if(!storyBackdrop.hidden){if(e.key==="Escape"){requestCloseStory();return}keepFocusInside(e,storySheet);return}if(sheetBackdrop.hidden)return;if(e.key==="Escape"){requestCloseDetail();return}keepFocusInside(e,sheet)});

    const SpeechRecognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognitionCtor){micBtn.disabled=true;micBtn.title="이 브라우저에서는 음성 입력을 지원하지 않습니다"}else{const recognition=new SpeechRecognitionCtor();recognition.lang="ko-KR";recognition.interimResults=false;recognition.maxAlternatives=1;micBtn.addEventListener("click",()=>{try{recognition.start();setStatus("말씀해 주세요…")}catch(_){}});recognition.addEventListener("result",e=>{const text=e.results?.[0]?.[0]?.transcript||"";input.value=text;searchExpressions(text)});recognition.addEventListener("error",()=>setStatus("음성 입력을 사용할 수 없습니다. 텍스트로 검색해 주세요.",true))}

    if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(error=>console.warn("PWA registration failed",error))}
    updateLearningCounts();loadCategories();if(matchMedia("(pointer:fine)").matches)input.focus();
  </script>
